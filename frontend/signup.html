<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>Create an Account | NearU</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8" aria-label="Main navigation">
      <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-primary-600">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary-600 text-sm text-white">🏠</span>
        NearU.
      </a>
      <a href="login.html" class="text-sm font-medium text-primary-600 hover:text-primary-700">Log in</a>
    </nav>
  </header>

  <main class="mx-auto flex min-h-[calc(100vh-4rem)] max-w-7xl items-center justify-center px-4 py-12 sm:px-6">
    <section class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8" aria-labelledby="signup-title">
      <div class="mb-8 text-center">
        <h1 id="signup-title" class="text-3xl font-bold text-slate-900">Create your account</h1>
        <p class="mt-2 text-sm text-slate-500">Join NearU to find or list a student home.</p>
      </div>

      <form id="signup-form" class="space-y-5">
        <div>
          <label for="name" class="mb-1.5 block text-sm font-medium text-slate-700">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" required
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-primary-500 focus:ring-2 focus:ring-primary-100"
            placeholder="Your full name" />
        </div>
        <div>
          <label for="email" class="mb-1.5 block text-sm font-medium text-slate-700">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-primary-500 focus:ring-2 focus:ring-primary-100"
            placeholder="you@example.com" />
        </div>
        <div>
          <label for="role" class="mb-1.5 block text-sm font-medium text-slate-700">I am a...</label>
          <select id="role" name="role"
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-primary-500 focus:ring-2 focus:ring-primary-100">
            <option value="student">Student (looking for a room)</option>
            <option value="landlord">Landlord (listing a property)</option>
          </select>
        </div>
        <div>
          <label for="password" class="mb-1.5 block text-sm font-medium text-slate-700">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-primary-500 focus:ring-2 focus:ring-primary-100"
            placeholder="At least 6 characters" />
        </div>
        <div>
          <label for="confirm-password" class="mb-1.5 block text-sm font-medium text-slate-700">Confirm password</label>
          <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="6" required
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-primary-500 focus:ring-2 focus:ring-primary-100"
            placeholder="Enter your password again" />
        </div>
        <button id="signup-btn" type="submit"
          class="w-full rounded-lg bg-primary-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2">
          Create Account
        </button>
        <p id="form-message" class="hidden rounded-lg p-3 text-sm" role="status"></p>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500">
        Already have an account? <a href="login.html" class="font-medium text-primary-600 hover:underline">Log in</a>
      </p>
      <a href="index.html" class="mt-6 block text-center text-sm text-slate-500 hover:text-primary-600">← Back to home</a>
    </section>
  </main>

  <script src="frontend-api.js"></script>
  <script>
    const signupQuery = new URLSearchParams(window.location.search);
    const returnToListings = signupQuery.get('redirect') === 'landlords.html';
    const postSignupPage = returnToListings ? 'landlords.html' : 'index.html';

    if (NearUAPI.currentUser()) {
      window.location.href = postSignupPage;
    }

    const form = document.getElementById('signup-form');
    const roleSelect = document.getElementById('role');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirm-password');
    const message = document.getElementById('form-message');
    const btn = document.getElementById('signup-btn');

    if (signupQuery.get('role') === 'landlord') {
      roleSelect.value = 'landlord';
    }

    confirmPassword.addEventListener('input', () => {
      confirmPassword.setCustomValidity(
        confirmPassword.value && confirmPassword.value !== password.value
          ? 'Passwords do not match.'
          : ''
      );
    });
    password.addEventListener('input', () => {
      confirmPassword.dispatchEvent(new Event('input'));
    });

    function showMessage(text, ok) {
      message.textContent = text;
      message.className = 'rounded-lg p-3 text-sm ' +
        (ok ? 'bg-emerald-50 text-emerald-800' : 'bg-red-50 text-red-800');
      message.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.classList.add('hidden');

      if (password.value !== confirmPassword.value) {
        showMessage('Passwords do not match.', false);
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const data = await NearUAPI.signup({
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim(),
          password: password.value,
          role: roleSelect.value
        });
        showMessage('Account created! Welcome ' + data.user.name, true);
        setTimeout(() => { window.location.href = postSignupPage; }, 800);
      } catch (err) {
        showMessage(err.message || 'Sign up failed. Is the backend running?', false);
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
