<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>Log In | NearU</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8" aria-label="Main navigation">
      <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-primary-600">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary-600 text-sm text-white">🏠</span>
        NearU.
      </a>
      <a href="signup.html" class="text-sm font-medium text-primary-600 hover:text-primary-700">Create an account</a>
    </nav>
  </header>

  <main class="mx-auto flex min-h-[calc(100vh-4rem)] max-w-7xl items-center justify-center px-4 py-12 sm:px-6">
    <section class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8" aria-labelledby="login-title">
      <div class="mb-8 text-center">
        <h1 id="login-title" class="text-3xl font-bold text-slate-900">Welcome back</h1>
        <p class="mt-2 text-sm text-slate-500">Log in to continue your NearU journey.</p>
      </div>

      <form id="login-form" class="space-y-5">
        <div>
          <label for="email" class="mb-1.5 block text-sm font-medium text-slate-700">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-primary-500 focus:ring-2 focus:ring-primary-100"
            placeholder="student@nearu.com" />
        </div>
        <div>
          <label for="password" class="mb-1.5 block text-sm font-medium text-slate-700">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-primary-500 focus:ring-2 focus:ring-primary-100"
            placeholder="password123" />
        </div>
        <button id="login-btn" type="submit"
          class="w-full rounded-lg bg-primary-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2">
          Log In
        </button>
        <p id="form-message" class="hidden rounded-lg p-3 text-sm" role="status"></p>
      </form>

      <p class="mt-4 text-center text-xs text-slate-400">
        Demo: student@nearu.com / password123
      </p>

      <p class="mt-6 text-center text-sm text-slate-500">
        New to NearU? <a href="signup.html" class="font-medium text-primary-600 hover:underline">Create an account</a>
      </p>
      <a href="index.html" class="mt-6 block text-center text-sm text-slate-500 hover:text-primary-600">← Back to home</a>
    </section>
  </main>

  <script src="frontend-api.js"></script>
  <script>
    const returnToListings = new URLSearchParams(window.location.search).get('redirect') === 'landlords.html';
    const postLoginPage = returnToListings ? 'landlords.html' : 'index.html';

    // បើ login រួចហើយ → ទៅទំព័រដើម
    if (NearUAPI.currentUser()) {
      window.location.href = postLoginPage;
    }

    const form = document.getElementById('login-form');
    const message = document.getElementById('form-message');
    const btn = document.getElementById('login-btn');

    function showMessage(text, ok) {
      message.textContent = text;
      message.className = 'rounded-lg p-3 text-sm ' +
        (ok ? 'bg-emerald-50 text-emerald-800' : 'bg-red-50 text-red-800');
      message.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const data = await NearUAPI.login({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        });
        showMessage('Login successful! Welcome ' + data.user.name, true);
        setTimeout(() => { window.location.href = postLoginPage; }, 800);
      } catch (err) {
        showMessage(err.message || 'Login failed. Is the backend running?', false);
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
